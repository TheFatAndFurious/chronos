# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronos_test
      POSTGRES_PASSWORD: chronos_test
      POSTGRES_DB: chronos_loadtest
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos_test -d chronos_loadtest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chronos:
    build:
      context: ../../../
      dockerfile: Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://chronos_test:chronos_test@postgres:5432/chronos_loadtest
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    volumes:
      - ./scripts:/scripts
    depends_on:
      - chronos
